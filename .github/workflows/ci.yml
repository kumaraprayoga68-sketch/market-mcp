name: CI

on:
  push:
    branches: [main]
    # The scan job commits snapshots back to main; re-running the test suite
    # for a data-only commit would just burn minutes.
    paths-ignore: ["snapshots/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; 3.14 is what the author runs.
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        # The suite is fully offline, so CI needs no secrets and cannot flake
        # on an upstream market API being slow.
        run: pytest -q

  smoke:
    # Proves the server actually starts and serves tools over stdio, which the
    # unit tests deliberately do not cover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Server starts and lists tools
        run: |
          python - <<'PY'
          import asyncio
          from market_mcp.server import build_server

          async def main():
              server = build_server()
              tools = await server.list_tools()
              names = sorted(t.name for t in tools)
              print(f"{len(names)} tools: {names}")
              assert len(names) == 20, f"expected 20 tools, got {len(names)}"

          asyncio.run(main())
          PY
